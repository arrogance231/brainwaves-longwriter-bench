[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwaves-longwriter-bench"
version = "0.1.0"
description = "Reproducible MI300X long-context serving and fiction evaluation for Brainwaves"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
judges = ["openai>=1.0"]
train = ["torch>=2.2", "transformers>=5.0", "peft>=0.13", "datasets>=2.20", "accelerate>=0.33"]

[tool.setuptools]
packages = []
